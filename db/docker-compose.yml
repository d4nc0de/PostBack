services:
  mongodb:
    image: mongo:8.2
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS}
      MONGO_INITDB_DATABASE: mydatabase
    
  #Contenedor para pruebas usando DBGate
  dbgate:
    image: dbgate/dbgate
    restart: always
    ports:
      - 80:3000
    volumes:
      - dbgate-data:/root/.dbgate
    environment:
      CONNECTIONS: con3
      LABEL_con3: MongoDB
      URL_con3: mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/mydatabase?authSource=admin
      ENGINE_con3: mongo@dbgate-plugin-mongo

volumes:
  mongo_data:
  dbgate-data:
    driver: local